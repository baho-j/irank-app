name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Not yet blocking: eslint-config-next 16 enabled React Compiler rules
      # that flag 121 pre-existing violations. Tracked in BACKLOG.md; this step
      # keeps them visible until they are fixed, then loses continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fail on new critical or high advisories
        run: npm audit --audit-level=high
